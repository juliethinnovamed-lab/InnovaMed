<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clínica Psiquiátrica</title>

    <style>
        :root {
            --p: #2b3e50;
            --b: #d0d7de;
            --m: #57606a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            color: #24292f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
        }

        body {
            padding: 15px;
        }

        .doc {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            background: #fff;
            padding: 15mm 15mm 20mm;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--p);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            flex: 0 0 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hm {
            flex: 1;
            padding: 0 10px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--p);
            text-transform: uppercase;
            margin: 0 0 2px;
            letter-spacing: 0.5px;
        }

        .sub {
            font-size: 10px;
            font-weight: bold;
            color: var(--m);
            margin-bottom: 2px;
        }

        .docline {
            font-size: 9px;
            color: var(--m);
        }

        .patient {
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr 1fr 1.5fr;
            border-bottom: 1px solid var(--p);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .pi {
            padding: 2px 6px;
            min-width: 0;
        }

        .lab {
            display: block;
            font-size: 8px;
            color: var(--m);
            text-transform: uppercase;
            font-weight: bold;
        }

        .val {
            font-weight: 600;
            word-break: break-word;
            font-size: 10.5px;
        }

        .sec {
            margin: 12px 0;
        }

        .st {
            color: var(--p);
            font-weight: 700;
            padding: 4px 0;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--p);
            break-after: avoid;
        }

        .sst {
            color: var(--p);
            font-weight: 700;
            font-size: 10px;
            padding: 4px 0 2px;
            margin: 6px 0 3px;
            break-after: avoid;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
        }

        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px 6px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
        }

        .grid-5 .f {
            border-bottom: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        .f {
            padding: 3px 2px;
            break-inside: avoid;
            min-width: 0;
            text-align: left;
            border-bottom: 1px dotted var(--b);
        }

        .grid-3 .f, .grid-2 .f {
            border-bottom: none;
        }

        .f.full {
            grid-column: 1 / -1;
        }

        .fl {
            display: block;
            color: var(--m);
            font-size: 8px;
            font-weight: 700;
            margin-bottom: 1px;
            text-align: left;
            text-transform: uppercase;
        }

        .fv {
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
            line-height: 1.35;
            font-size: 10px;
        }

        .mental {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
        }

        .mi {
            padding: 3px 2px;
            break-inside: avoid;
            border-bottom: 1px dotted var(--b);
        }

        .mil {
            font-size: 8px;
            font-weight: 700;
            color: var(--m);
            text-transform: uppercase;
        }

        .miv {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 1px;
            text-align: left;
            font-size: 10px;
        }

        .formula {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 8px;
            font-size: 10px;
            background: #fff;
        }

        .tbl th {
            color: var(--p);
            font-weight: 700;
            padding: 4px 6px;
            border-bottom: 2px solid var(--p);
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            background: transparent;
        }

        .tbl td {
            padding: 6px;
            border-bottom: 1px solid var(--b);
            color: #24292f;
            word-break: break-word;
            text-align: left;
            vertical-align: top;
            font-size: 10px;
        }

        .tbl-familiar {
            table-layout: fixed;
            font-size: 8px;
        }

        .tbl-familiar th {
            padding: 4px 3px;
            font-size: 7px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar td {
            padding: 5px 3px;
            font-size: 8px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar th:nth-child(1) { width: 14%; }
        .tbl-familiar th:nth-child(2) { width: 5%; }
        .tbl-familiar th:nth-child(3) { width: 7%; }
        .tbl-familiar th:nth-child(4) { width: 17%; }
        .tbl-familiar th:nth-child(5) { width: 9%; }
        .tbl-familiar th:nth-child(6) { width: 9%; }
        .tbl-familiar th:nth-child(7) { width: 17%; }
        .tbl-familiar th:nth-child(8) { width: 22%; }

        .tbl-familiar tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .footer {
            position: fixed;
            left: 15mm;
            right: 15mm;
            bottom: 6mm;
            border-top: 1px solid var(--b);
            padding-top: 4px;
            text-align: center;
            color: var(--m);
            font-size: 8px;
            background: #fff;
        }

        .footer span:not(:last-child)::after {
            content: ' | ';
            margin: 0 4px;
        }

        .buttons {
            position: fixed;
            right: 12px;
            top: 12px;
            z-index: 20;
        }

        button {
            border: 0;
            border-radius: 4px;
            background: var(--p);
            color: white;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: var(--m);
            padding: 20px;
        }

        @page {
            size: A4;
            margin: 10mm 15mm 15mm;
        }

        @media print {
            html, body {
                background: #fff;
                padding: 0;
            }

            .doc {
                width: auto;
                min-height: 0;
                margin: 0;
                padding: 0 0 15mm;
                box-shadow: none;
            }

            .buttons {
                display: none;
            }

            .footer {
                position: fixed;
                bottom: 2mm;
                left: 15mm;
                right: 15mm;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">
        <button onclick="window.print()">Imprimir / PDF</button>
    </div>

    <main class="doc">

        <header class="header">
            <div class="logo" id="logo">
                <img src="https://lh3.googleusercontent.com/d/1uGZTuLKjjurxjNOODEeSPy5NES6SIgDQ" alt="Logo">
            </div>
            <div class="hm">
                <h1 class="title" id="titulo"></h1>
                <div class="sub" id="subtitulo"></div>
                <div class="docline" id="info-institucion"></div>
            </div>
        </header>

        <div class="patient" id="patient"></div>
        <div id="content"></div>
        <div id="empty" class="empty" style="display:none">No se encontraron datos clínicos para mostrar.</div>

    </main>

    <footer class="footer" id="footer"></footer>

    <script>
        (() => {
            const q = new URLSearchParams(location.search);

            const g = k => {
                if (q.has(k)) return q.get(k) || '';
                const altKey = k.replace(/\+/g, ' ');
                if (q.has(altKey)) return q.get(altKey) || '';
                for (let [key, val] of q.entries()) {
                    if (key.replace(/\s+/g, '+') === k.replace(/\s+/g, '+')) return val;
                }
                return '';
            };

            const C = v => String(v ?? '').trim();
            const A = k => { const x = g(k); return x === '' ? [] : x.split('|'); };
            const V = (a, i) => C(a && a[i] !== undefined ? a[i] : '');

            const FX = v => {
                const val = C(v);
                return val.toUpperCase() === 'X' ? 'Sí' : val;
            };

            const E = v => String(v ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

            const F = (l, v, full = false) => {
                const val = FX(v);
                if (!val) return '';
                return `<div class="f ${full ? 'full' : ''}">${l ? `<span class="fl">${E(l)}</span>` : ''}<div class="fv">${E(val)}</div></div>`;
            };

            const M = (l, v) => {
                const val = FX(v);
                return val ? `<div class="mi"><div class="mil">${E(l)}</div><div class="miv">${E(val)}</div></div>` : '';
            };

            const SS = (t, h) => h && h.trim() ? `<div class="sst">${E(t)}</div>${h}` : '';
            const SEC = (t, h) => h && h.trim() ? `<section class="sec"><div class="st">${E(t)}</div>${h}</section>` : '';

            const parseRows = v => {
                if (!C(v)) return [];
                return v.split(/\|\||\n|~~/).map(x => x.split('|').map(C)).filter(x => x.some(Boolean));
            };

            document.getElementById('titulo').textContent = g('Titulo') || 'HISTORIA CLÍNICA PSIQUIÁTRICA';
            document.getElementById('subtitulo').textContent = g('Subtitulo');
            
            const instInfo = [
                g('Medico+tratante') || g('Medico tratante') ? `<strong>Médico tratante:</strong> ${g('Medico+tratante') || g('Medico tratante')}` : '',
                g('Especialidad+Medica') || g('Especialidad Medica') ? `<strong>Especialidad:</strong> ${g('Especialidad+Medica') || g('Especialidad Medica')}` : ''
            ].filter(Boolean).join(' &nbsp;|&nbsp; ');
            document.getElementById('info-institucion').innerHTML = instInfo;

            const pi = [
                ['Paciente', g('Paciente')],
                ['Sexo', g('Sexo')],
                ['Cédula', g('Cedula')],
                ['Edad', g('Edad')],
                ['Teléfono', g('Telefono')]
            ].filter(x => C(x[1]));

            const patientContainer = document.getElementById('patient');
            if (pi.length > 0) {
                patientContainer.innerHTML = pi.map(x => `<div class="pi"><span class="lab">${E(x[0])}</span><span class="val">${E(x[1])}</span></div>`).join('');
            } else {
                patientContainer.style.display = 'none';
            }

            const p1 = A('P1');
            const p2 = A('P2');
            const p3 = A('P3');
            const p7 = A('P7');

            let h = '';

            const datosPersonalesExtra =
                F('Fecha de ingreso', g('FechaIngreso')) +
                F('Fecha de nacimiento', g('FechaNacimiento')) +
                F('Lugar de nacimiento', g('LugarNacimiento')) +
                F('Dirección del paciente', g('DireccionPaciente')) +
                F('Estado civil', g('EstadoCivil')) +
                F('Profesión / Ocupación', g('ProfesionOcupacion')) +
                F('Contacto de emergencia', g('ContactoEmergencia'), true);
            if (datosPersonalesExtra) {
                h += SEC('Datos personales complementarios', `<div class="grid">${datosPersonalesExtra}</div>`);
            }

            let x = F('Motivo de consulta', V(p1, 0), true) + F('Enfermedad actual', V(p1, 1), true);
            let v = F('TA', V(p1, 2)) + F('FC', V(p1, 3)) + F('FR', V(p1, 4)) + F('Circunferencia abdominal', V(p1, 5)) + F('Peso', V(p1, 6)) + F('Talla', V(p1, 7)) + F('IMC', V(p1, 8));
            if (v) x += SS('Constantes vitales y somatometría', `<div class="grid">${v}</div>`);
            if (x) h += SEC('Motivo de consulta y enfermedad actual', x);

            let m = '';
            m += SS('1. Aspecto, porte, conación y actitud', `<div class="mental">${M('Aspecto general', V(p1, 9))}${M('Presentación y vestimenta', V(p1, 10))}${M('Actitud ante la entrevista', V(p1, 11))}${M('Conación / Psicomotricidad', V(p1, 12))}</div>`);
            m += SS('2. Conciencia y funciones cognitivas', `<div class="mental">${M('Nivel de conciencia', V(p1, 13))}${M('Orientación', V(p1, 14))}${M('Atención', V(p1, 15))}${M('Concentración', V(p1, 16))}${M('Memoria', V(p1, 17))}${M('Cálculo y abstracción', V(p1, 18))}</div>`);
            m += SS('3. Lenguaje', `<div class="mental">${M('Expresión / Emisión', V(p1, 19))}${M('Comprensión', V(p1, 20))}${M('Velocidad y Ritmo', V(p1, 21))}${M('Alteraciones de la Estructura y Semántica', V(p1, 22))}</div>`);
            m += SS('4. Afecto y estado de ánimo', `<div class="mental">${M('Expresión o Intensidad', V(p1, 23))}${M('Modulación', V(p1, 24))}${M('Resonante', V(p1, 25))}</div>`);
            m += SS('5. Pensamiento — curso, forma y contenido', `<div class="mental">${M('Curso / Velocidad', V(p1, 26))}${M('Forma / Lógica', V(p1, 27))}${M('Contenido / Ideación', V(p1, 28))}${M('Ideas sobrevaloradas', V(p1, 29))}${M('Ideas delirantes', V(p1, 30))}${M('Ideas de muerte', V(p1, 31))}${M('Ideación suicida', V(p1, 32))}${M('Ideación suicida activa', V(p1, 33))}${M('Ideas obsesivas / Fóbicas', V(p1, 34))}${M('Ideas de minusvalía / Culpa / Desesperanza', V(p1, 35))}</div>`);
            m += SS('6. Percepción (Sensopercepción)', `<div class="mental">${M('Alteraciones', V(p1, 36))}</div>`);
            m += SS('7. Juicio de realidad e introspección (Insight)', `<div class="mental">${M('Juicio de realidad', V(p1, 37))}${M('Introspección (Conciencia de enfermedad)', V(p1, 38))}</div>`);
            if (m) h += SEC('Examen Mental Actual (EMA)', m);

            let a = '';
            let per = F('Producto de embarazo', V(p2, 0)) + F('Semanas de embarazo', V(p2, 1)) + F('Respiró y lloró al nacer', V(p2, 2)) + F('Alimentación', V(p2, 3)) + F('Desarrollo psicomotor', V(p2, 4)) + F('Control postural', V(p2, 5)) + F('Sostener la cabeza', V(p2, 6)) + F('Sentarse sin apoyo y ponerse de pie', V(p2, 7)) + F('Locomoción', V(p2, 8)) + F('Gatear', V(p2, 9)) + F('Caminar', V(p2, 10)) + F('Correr y saltar con uno o ambos pies', V(p2, 11)) + F('Equilibrio', V(p2, 12)) + F('Mantenerse estable de pie o sobre un solo pie', V(p2, 13)) + F('Caminar en línea recta', V(p2, 14));
            if (per) a += SS('Perinatales y desarrollo (menores de 18 años)', `<div class="grid">${per}</div>`);

            const isNegarAPP = V(p2, 47).toUpperCase() === 'X';

            if (isNegarAPP) {
                const textAPP = V(p2, 48) || 'Negar APP';
                a += SS('1. Antecedentes Médicos Patológicos (APP)', `<div class="f full"><div class="fv">${E(textAPP)}</div></div>`);
            } else {
                let tceBlock = '';
                if (V(p2, 17) || V(p2, 18) || V(p2, 19)) {
                    tceBlock = `<div class="grid-3">${F('Traumatismo Craneoencefálico (TCE)', V(p2, 17))}${F('Pérdida de conciencia', V(p2, 18))}${F('Duración', V(p2, 19))}</div>`;
                }

                let epilBlock = '';
                if (V(p2, 20) || V(p2, 21) || V(p2, 22)) {
                    epilBlock = `<div class="grid-3">${F('Epilepsia / Crisis convulsivas', V(p2, 20))}${F('Tratamiento Actual', V(p2, 21))}${F('Notas / Especificar', V(p2, 22))}</div>`;
                }

                let evcBlock = '';
                if (V(p2, 23) || V(p2, 24) || V(p2, 25)) {
                    evcBlock = `<div class="grid-3">${F('Enfermedad Vascular Cerebral (EVC)', V(p2, 23))}${F('Tratamiento Actual', V(p2, 24))}${F('Notas / Especificar', V(p2, 25))}</div>`;
                }

                let demBlock = '';
                if (V(p2, 26) || V(p2, 27) || V(p2, 28)) {
                    demBlock = `<div class="grid-3">${F('Deterioro Cognitivo / Demencia', V(p2, 26))}${F('Tratamiento Actual', V(p2, 27))}${F('Notas / Especificar', V(p2, 28))}</div>`;
                }

                let cefBlock = '';
                if (V(p2, 29) || V(p2, 30) || V(p2, 31)) {
                    cefBlock = `<div class="grid-3">${F('Cefaleas crónicas / Migraña', V(p2, 29))}${F('Tratamiento Actual', V(p2, 30))}${F('Notas / Especificar', V(p2, 31))}</div>`;
                }

                let otroNeuBlock = '';
                if (V(p2, 32) || V(p2, 33) || V(p2, 34) || V(p2, 35)) {
                    const textoCual = V(p2, 33) || V(p2, 32);
                    otroNeuBlock = `<div class="grid-3">${F('Otro trastorno neurológico', textoCual)}${F('Tratamiento Actual', V(p2, 34))}${F('Notas / Especificar', V(p2, 35))}</div>`;
                }

                let appVals = tceBlock + epilBlock + evcBlock + demBlock + cefBlock + otroNeuBlock +
                              F('Endocrinos / Metabólicos', V(p2, 36)) + 
                              F('Cardiovasculares', V(p2, 37)) + 
                              F('Renales y Hepáticos', V(p2, 38)) + 
                              F('Año', V(p2, 40)) + 
                              F('Tipo de Cirugía/causa', V(p2, 41)) + 
                              F('Cirugía Bariátrica', V(p2, 42)) + 
                              F('Delirium postoperatorio previo', V(p2, 43)) + 
                              F('Alergias a medicamentos generales', V(p2, 45), true) + 
                              F('Reacciones graves a psicofármacos previos', V(p2, 46), true);
                if (appVals) a += SS('1. Antecedentes Médicos Patológicos (APP)', `<div class="grid">${appVals}</div>`);
            }

            let ago = '';
            let fo = F('G', V(p2, 55)) + F('P', V(p2, 56)) + F('A', V(p2, 57)) + F('C', V(p2, 58));
            if (fo) ago += `<div class="f full"><span class="fl">Fórmula Obstétrica</span><div class="formula">${fo}</div></div>`;
            
            ago += F('Menarca', V(p2, 50)) + 
                   F('Ciclos menstruales', V(p2, 51)) + 
                   F('Duración y frecuencia', V(p2, 52)) + 
                   F('FUM', V(p2, 53)) + 
                   F('Hijos vivos', V(p2, 59)) + 
                   F('Complicaciones obstétricas', V(p2, 60), true) + 
                   F('Estado actual', V(p2, 61)) + 
                   F('Embarazo actual', V(p2, 62)) + 
                   F('Semanas de gestación', V(p2, 63)) + 
                   F('Lactancia activa', V(p2, 64)) + 
                   F('Anticonceptivos hormonales', V(p2, 65)) + 
                   F('Nombre / Tipo', V(p2, 66));

            const isNegarAGO = V(p2, 67).trim().toUpperCase() === 'X';
            if (isNegarAGO) {
                const notaNiegaAGO = V(p2, 68) || 'Sin antecedentes ginecoobstétricos patológicos o de riesgo actuales.';
                ago += `<div class="f full"><span class="fl">Paciente niega AGO</span><div class="fv">${E(notaNiegaAGO)}</div></div>`;
            }

            if (ago) a += SS('Antecedentes ginecoobstétricos (AGO)', `<div class="grid">${ago}</div>`);

            if (a) h += SEC('Antecedentes personales', a);

            // --- SECCIÓN: ANTECEDENTES PSIQUIÁTRICOS PREVIOS (P3) ---
            let ps = '';
            const isPrimeraVez = V(p3, 1).toUpperCase() === 'X';
            if (isPrimeraVez || C(V(p3, 1))) {
                ps += SS('3. Antecedentes psiquiátricos previos (APP-Psi)', `<div class="grid">${F('Primera vez en Psiquiatría', V(p3, 1))}${F('Nota primera vez', V(p3, 2), true)}</div>`);
            }

            const dxPairs = [
                ['Trastorno Depresivo', 4, 5],
                ['Trastorno Bipolar', 6, 7],
                ['Trastornos de Ansiedad', 8, 9],
                ['Trastorno Obsesivo-Compulsivo (TOC) o trastornos relacionados', 10, 11],
                ['Trastorno por Estrés Postraumático (TEPT) o del desarrollo/apego', 12, 13],
                ['Trastorno del Espectro de la Esquizofrenia / Otros trastornos psicóticos', 14, 15],
                ['Trastorno por Déficit de Atención e Hiperactividad (TDAH)', 16, 17],
                ['Trastorno del Neurodesarrollo (TEA nivel 1, 2 o 3)', 18, 19],
                ['Trastornos de la Conducta Alimentaria (Anorexia, Bulimia, PICA, etc.)', 20, 21],
                ['Trastorno de la Personalidad', 22, 23]
            ];

            let dxBlocks = '';
            dxPairs.forEach(([labelTrastorno, idxT, idxE]) => {
                const valT = V(p3, idxT);
                const valE = V(p3, idxE);
                if (valT || valE) {
                    dxBlocks += `<div class="grid-2">${F(labelTrastorno, valT)}${F('Edad de diagnóstico / Año', valE)}</div>`;
                }
            });
