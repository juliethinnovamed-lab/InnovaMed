<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clínica Psiquiátrica</title>

    <style>
        :root {
            --p: #2b3e50;
            --b: #d0d7de;
            --m: #57606a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            color: #24292f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
        }

        body {
            padding: 15px;
        }

        .doc {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            background: #fff;
            padding: 15mm 15mm 20mm;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--p);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            flex: 0 0 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hm {
            flex: 1;
            padding: 0 10px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--p);
            text-transform: uppercase;
            margin: 0 0 2px;
            letter-spacing: 0.5px;
        }

        .sub {
            font-size: 10px;
            font-weight: bold;
            color: var(--m);
            margin-bottom: 2px;
        }

        .docline {
            font-size: 9px;
            color: var(--m);
        }

        .patient {
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr 1fr 1.5fr;
            border-bottom: 1px solid var(--p);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .pi {
            padding: 2px 6px;
            min-width: 0;
        }

        .lab {
            display: block;
            font-size: 8px;
            color: var(--m);
            text-transform: uppercase;
            font-weight: bold;
        }

        .val {
            font-weight: 600;
            word-break: break-word;
            font-size: 10.5px;
        }

        .sec {
            margin: 12px 0;
        }

        .st {
            color: var(--p);
            font-weight: 700;
            padding: 4px 0;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--p);
            break-after: avoid;
        }

        .sst {
            color: var(--p);
            font-weight: 700;
            font-size: 10px;
            padding: 4px 0 2px;
            margin: 6px 0 3px;
            break-after: avoid;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px 6px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
        }

        .grid-5 .f {
            border-bottom: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        .f {
            padding: 3px 2px;
            break-inside: avoid;
            min-width: 0;
            text-align: left;
            border-bottom: 1px dotted var(--b);
        }

        .grid-3 .f, .grid-2 .f {
            border-bottom: none;
        }

        .f.full {
            grid-column: 1 / -1;
        }

        .fl {
            display: block;
            color: var(--m);
            font-size: 8px;
            font-weight: 700;
            margin-bottom: 1px;
            text-align: left;
            text-transform: uppercase;
        }

        .fv {
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
            line-height: 1.35;
            font-size: 10px;
        }

        .mental {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
        }

        .mi {
            padding: 3px 2px;
            break-inside: avoid;
            border-bottom: 1px dotted var(--b);
        }

        .mil {
            font-size: 8px;
            font-weight: 700;
            color: var(--m);
            text-transform: uppercase;
        }

        .miv {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 1px;
            text-align: left;
            font-size: 10px;
        }

        .formula {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 8px;
            font-size: 10px;
            background: #fff;
        }

        .tbl th {
            color: var(--p);
            font-weight: 700;
            padding: 4px 6px;
            border-bottom: 2px solid var(--p);
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            background: transparent;
        }

        .tbl td {
            padding: 6px;
            border-bottom: 1px solid var(--b);
            color: #24292f;
            word-break: break-word;
            text-align: left;
            vertical-align: top;
            font-size: 10px;
        }

        .tbl-familiar {
            table-layout: fixed;
            font-size: 8px;
        }

        .tbl-familiar th {
            padding: 4px 3px;
            font-size: 7px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar td {
            padding: 5px 3px;
            font-size: 8px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar th:nth-child(1) { width: 14%; }
        .tbl-familiar th:nth-child(2) { width: 5%; }
        .tbl-familiar th:nth-child(3) { width: 7%; }
        .tbl-familiar th:nth-child(4) { width: 17%; }
        .tbl-familiar th:nth-child(5) { width: 9%; }
        .tbl-familiar th:nth-child(6) { width: 9%; }
        .tbl-familiar th:nth-child(7) { width: 17%; }
        .tbl-familiar th:nth-child(8) { width: 22%; }

        .tbl-familiar tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .footer {
            position: fixed;
            left: 15mm;
            right: 15mm;
            bottom: 6mm;
            border-top: 1px solid var(--b);
            padding-top: 4px;
            text-align: center;
            color: var(--m);
            font-size: 8px;
            background: #fff;
        }

        .footer span:not(:last-child)::after {
            content: ' | ';
            margin: 0 4px;
        }

        .buttons {
            position: fixed;
            right: 12px;
            top: 12px;
            z-index: 20;
        }

        button {
            border: 0;
            border-radius: 4px;
            background: var(--p);
            color: white;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: var(--m);
            padding: 20px;
        }

        @page {
            size: A4;
            margin: 10mm 15mm 15mm;
        }

        @media print {
            html, body {
                background: #fff;
                padding: 0;
            }

            .doc {
                width: auto;
                min-height: 0;
                margin: 0;
                padding: 0 0 15mm;
                box-shadow: none;
            }

            .buttons {
                display: none;
            }

            .footer {
                position: fixed;
                bottom: 2mm;
                left: 15mm;
                right: 15mm;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">
        <button onclick="window.print()">Imprimir / PDF</button>
    </div>

    <main class="doc">

        <header class="header">
            <div class="logo" id="logo">
                <img src="https://lh3.googleusercontent.com/d/1uGZTuLKjjurxjNOODEeSPy5NES6SIgDQ" alt="Logo">
            </div>
            <div class="hm">
                <h1 class="title" id="titulo"></h1>
                <div class="sub" id="subtitulo"></div>
                <div class="docline" id="info-institucion"></div>
            </div>
        </header>

        <div class="patient" id="patient"></div>
        <div id="content"></div>
        <div id="empty" class="empty" style="display:none">No se encontraron datos clínicos para mostrar.</div>

    </main>

    <footer class="footer" id="footer"></footer>

    <script>
        (async () => {
            const q = new URLSearchParams(location.search);
            const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEI2zkOEQoSYn3ltP9Ea2SfWBsucVBBcltoU-uAN9EHWp6Hx6TIfZjTXyZ1hWHNCPqsQ/exec';

            function render() {
            const g = k => {
                if (q.has(k)) return q.get(k) || '';
                const altKey = k.replace(/\+/g, ' ');
                if (q.has(altKey)) return q.get(altKey) || '';
                for (let [key, val] of q.entries()) {
                    if (key.replace(/\s+/g, '+') === k.replace(/\s+/g, '+')) return val;
                }
                return '';
            };

            const C = v => String(v ?? '').trim();
            const A = k => { const x = g(k); return x === '' ? [] : x.split('|'); };
            const V = (a, i) => C(a && a[i] !== undefined ? a[i] : '');

            const FX = v => {
                const val = C(v);
                return val.toUpperCase() === 'X' ? 'Sí' : val;
            };

            const E = v => String(v ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

            const F = (l, v, full = false) => {
                const val = FX(v);
                if (!val) return '';
                return `<div class="f ${full ? 'full' : ''}">${l ? `<span class="fl">${E(l)}</span>` : ''}<div class="fv">${E(val)}</div></div>`;
            };

            const M = (l, v) => {
                const val = FX(v);
                return val ? `<div class="mi"><div class="mil">${E(l)}</div><div class="miv">${E(val)}</div></div>` : '';
            };

            const SS = (t, h) => h && h.trim() ? `<div class="sst">${E(t)}</div>${h}` : '';
            const SEC = (t, h) => h && h.trim() ? `<section class="sec"><div class="st">${E(t)}</div>${h}</section>` : '';

            const parseRows = v => {
                if (!C(v)) return [];
                return v.split(/\|\||\n|~~/).map(x => x.split('|').map(C)).filter(x => x.some(Boolean));
            };

            document.getElementById('titulo').textContent = g('Titulo') || 'HISTORIA CLÍNICA PSIQUIÁTRICA';
            document.getElementById('subtitulo').textContent = g('Subtitulo');
            
            const instInfo = [
                g('Medico+tratante') || g('Medico tratante') ? `<strong>Médico tratante:</strong> ${g('Medico+tratante') || g('Medico tratante')}` : '',
                g('Especialidad+Medica') || g('Especialidad Medica') ? `<strong>Especialidad:</strong> ${g('Especialidad+Medica') || g('Especialidad Medica')}` : ''
            ].filter(Boolean).join(' &nbsp;|&nbsp; ');
            document.getElementById('info-institucion').innerHTML = instInfo;

            const pi = [
                ['Paciente', g('Paciente')],
                ['Sexo', g('Sexo')],
                ['Cédula', g('Cedula')],
                ['Edad', g('Edad')],
                ['Teléfono', g('Telefono')]
            ].filter(x => C(x[1]));

            const patientContainer = document.getElementById('patient');
            if (pi.length > 0) {
                patientContainer.innerHTML = pi.map(x => `<div class="pi"><span class="lab">${E(x[0])}</span><span class="val">${E(x[1])}</span></div>`).join('');
            } else {
                patientContainer.style.display = 'none';
            }

            const p1 = A('P1');
            const p2 = A('P2');
            const p3 = A('P3');
            const p7 = A('P7');

            // Carga de las 5 nuevas columnas físicas desglosadas por tubería
            const neuro = A('VC_APP_Neurologicos');
            const endocrino = A('VC_APP_Endocrinos');
            const cardio = A('VC_APP_Cardiovascular');
            const renal = A('VC_APP_Renales');
            const gastro = A('VC_APP_HepaticoGastrointestinal');

            let h = '';

            const datosPersonalesExtra =
                F('Fecha de ingreso', g('FechaIngreso')) +
                F('Fecha de nacimiento', g('FechaNacimiento')) +
                F('Lugar de nacimiento', g('LugarNacimiento')) +
                F('Dirección del paciente', g('DireccionPaciente')) +
                F('Estado civil', g('EstadoCivil')) +
                F('Profesión / Ocupación', g('ProfesionOcupacion')) +
                F('Escolaridad', g('Escolaridad')) +
                F('Religión', g('Religion')) +
                F('Contacto de emergencia', g('ContactoEmergencia'), true);
            if (datosPersonalesExtra) {
                h += SEC('Datos personales complementarios', `<div class="grid">${datosPersonalesExtra}</div>`);
            }

            let x = F('Motivo de consulta', V(p1, 0), true) + F('Enfermedad actual', V(p1, 1), true);
            let v = F('TA', V(p1, 2)) + F('FC', V(p1, 3)) + F('FR', V(p1, 4)) + F('Circunferencia abdominal', V(p1, 5)) + F('Peso', V(p1, 6)) + F('Talla', V(p1, 7)) + F('IMC', V(p1, 8));
            if (v) x += SS('Constantes vitales y somatometría', `<div class="grid">${v}</div>`);
            if (x) h += SEC('Motivo de consulta y enfermedad actual', x);

            let m = '';
            m += SS('1. Aspecto, porte, conación y actitud', `<div class="mental">${M('Aspecto general', V(p1, 9))}${M('Presentación y vestimenta', V(p1, 10))}${M('Actitud ante la entrevista', V(p1, 11))}${M('Conación / Psicomotricidad', V(p1, 12))}</div>`);
            m += SS('2. Conciencia y funciones cognitivas', `<div class="mental">${M('Nivel de conciencia', V(p1, 13))}${M('Orientación', V(p1, 14))}${M('Atención', V(p1, 15))}${M('Concentración', V(p1, 16))}${M('Memoria', V(p1, 17))}${M('Cálculo y abstracción', V(p1, 18))}</div>`);
            m += SS('3. Lenguaje', `<div class="mental">${M('Expresión / Emisión', V(p1, 19))}${M('Comprensión', V(p1, 20))}${M('Velocidad y Ritmo', V(p1, 21))}${M('Alteraciones de la Estructura y Semántica', V(p1, 22))}</div>`);
            m += SS('4. Afecto y estado de ánimo', `<div class="mental">${M('Expresión o Intensidad', V(p1, 23))}${M('Modulación', V(p1, 24))}${M('Resonante', V(p1, 25))}</div>`);
            m += SS('5. Pensamiento — curso, forma y contenido', `<div class="mental">${M('Curso / Velocidad', V(p1, 26))}${M('Forma / Lógica', V(p1, 27))}${M('Contenido / Ideación', V(p1, 28))}${M('Ideas sobrevaloradas', V(p1, 29))}${M('Ideas delirantes', V(p1, 30))}${M('Ideas de muerte', V(p1, 31))}${M('Ideación suicida', V(p1, 32))}${M('Ideación suicida activa', V(p1, 33))}${M('Ideas obsesivas / Fóbicas', V(p1, 34))}${M('Ideas de minusvalía / Culpa / Desesperanza', V(p1, 35))}</div>`);
            m += SS('6. Percepción (Sensopercepción)', `<div class="mental">${M('Alteraciones', V(p1, 36))}</div>`);
            m += SS('7. Juicio de realidad e introspección (Insight)', `<div class="mental">${M('Juicio de realidad', V(p1, 37))}${M('Introspección (Conciencia de enfermedad)', V(p1, 38))}</div>`);
            if (m) h += SEC('Examen Mental Actual (EMA)', m);

            let a = '';
            let per = F('Producto de embarazo', V(p2, 0)) + F('Semanas de embarazo', V(p2, 1)) + F('Respiró y lloró al nacer', V(p2, 2)) + F('Alimentación', V(p2, 3)) + F('Desarrollo psicomotor', V(p2, 4)) + F('Control postural', V(p2, 5)) + F('Sostener la cabeza', V(p2, 6)) + F('Sentarse sin apoyo y ponerse de pie', V(p2, 7)) + F('Locomoción', V(p2, 8)) + F('Gatear', V(p2, 9)) + F('Caminar', V(p2, 10)) + F('Correr y saltar con uno o ambos pies', V(p2, 11)) + F('Equilibrio', V(p2, 12)) + F('Mantenerse estable de pie o sobre un solo pie', V(p2, 13)) + F('Caminar en línea recta', V(p2, 14));
            if (per) a += SS('Perinatales y desarrollo (menores de 18 años)', `<div class="grid">${per}</div>`);

            const isNegarAPP = V(p2, 148).toUpperCase() === 'X';

            if (isNegarAPP) {
                const textAPP = V(p2, 149) || 'Paciente niega antecedentes médicos patológicos.';
                a += SS('1. Antecedentes Médicos Patológicos (APP)', `<div class="f full"><div class="fv">${E(textAPP)}</div></div>`);
            } else {
                let appVals = '';

                // --- NEUROLÓGICOS ---
                let tceBlock = (V(neuro, 1) || V(neuro, 2) || V(neuro, 3)) ? `<div class="grid-3">${F('TCE', V(neuro, 1))}${F('Pérdida de conciencia', V(neuro, 2))}${F('Duración', V(neuro, 3))}</div>` : '';
                let epilBlock = (V(neuro, 4) || V(neuro, 5) || V(neuro, 6)) ? `<div class="grid-3">${F('Epilepsia / Convulsiones', V(neuro, 4))}${F('Tratamiento actual', V(neuro, 5))}${F('Notas / Especificar', V(neuro, 6))}</div>` : '';
                let evcBlock = (V(neuro, 7) || V(neuro, 8) || V(neuro, 9)) ? `<div class="grid-3">${F('EVC', V(neuro, 7))}${F('Tratamiento actual', V(neuro, 8))}${F('Notas / Especificar', V(neuro, 9))}</div>` : '';
                let demBlock = (V(neuro, 10) || V(neuro, 11) || V(neuro, 12)) ? `<div class="grid-3">${F('Deterioro Cognitivo / Demencia', V(neuro, 10))}${F('Tratamiento actual', V(neuro, 11))}${F('Notas / Especificar', V(neuro, 12))}</div>` : '';
                let cefBlock = (V(neuro, 13) || V(neuro, 14) || V(neuro, 15)) ? `<div class="grid-3">${F('Cefaleas / Migraña', V(neuro, 13))}${F('Tratamiento actual', V(neuro, 14))}${F('Notas / Especificar', V(neuro, 15))}</div>` : '';
                let otroNeuBlock = (V(neuro, 16) || V(neuro, 17) || V(neuro, 18) || V(neuro, 19)) ? `<div class="grid-3">${F('Otro trastorno neurológico', V(neuro, 17) || V(neuro, 16))}${F('Tratamiento actual', V(neuro, 18))}${F('Notas / Especificar', V(neuro, 19))}</div>` : '';

                let neurologicosTotal = tceBlock + epilBlock + evcBlock + demBlock + cefBlock + otroNeuBlock;
                if (neurologicosTotal) appVals += SS('Neurológicos', neurologicosTotal);

                // Función auxiliar para renderizar filas de 3 elementos (Diagnóstico, Año, Tratamiento)
                const condicionArr = (arr, nombre, idxDiag, idxAnio, idxTrat) => {
                    const diag = V(arr, idxDiag);
                    const anio = V(arr, idxAnio);
                    const trat = V(arr, idxTrat);
                    if (!diag && !anio && !trat) return '';
                    return `<div class="grid-3">${F(nombre, diag)}${F('Año', anio)}${F('Tratamiento', trat)}</div>`;
                };

                const otraCondicionArr = (arr, idxDiag, idxCual, idxAnio, idxTrat) => {
                    const diag = V(arr, idxDiag);
                    const cual = V(arr, idxCual);
                    const anio = V(arr, idxAnio);
                    const trat = V(arr, idxTrat);
                    if (!diag && !cual && !anio && !trat) return '';
                    return `<div class="grid-3">${F('Otro', diag)}${F('Cuál', cual, true)}${F('Año', anio)}${F('Tratamiento', trat, true)}</div>`;
                };

                // --- ENDOCRINOS / METABÓLICOS ---
                let endocrinos =
                    condicionArr(endocrino, 'Hipotiroidismo', 1, 2, 3) +
                    condicionArr(endocrino, 'Hipertiroidismo', 4, 5, 6) +
                    condicionArr(endocrino, 'Diabetes Mellitus Tipo 2', 7, 8, 9) +
                    condicionArr(endocrino, 'Diabetes Mellitus Tipo 1', 10, 11, 12) +
                    condicionArr(endocrino, 'Síndrome Metabólico / Dislipidemia', 13, 14, 15) +
                    condicionArr(endocrino, 'Síndrome de Ovario Poliquístico (SOP)', 16, 17, 18) +
                    otraCondicionArr(endocrino, 19, 20, 21, 22);
                if (endocrinos) appVals += SS('Endocrinos / Metabólicos', endocrinos);

                // --- CARDIOVASCULARES ---
                let cardiovasculares =
                    condicionArr(cardio, 'Hipertensión Arterial (HTA)', 1, 2, 3) +
                    condicionArr(cardio, 'Cardiopatía Isquémica / Infarto previo', 4, 5, 6) +
                    condicionArr(cardio, 'Insuficiencia Cardíaca', 7, 8, 9) +
                    otraCondicionArr(cardio, 10, 11, 12, 13);
                if (cardiovasculares) appVals += SS('Cardiovasculares', cardiovasculares);

                // --- RENALES ---
                let renales =
                    condicionArr(renal, 'Enfermedad Renal Crónica (ERC)', 1, 2, 3) +
                    condicionArr(renal, 'Lesión renal', 4, 5, 6) +
                    condicionArr(renal, 'Litiasis renal', 7, 8, 9) +
                    condicionArr(renal, 'ITU a repetición', 10, 11, 12) +
                    condicionArr(renal, 'ERC', 13, 14, 15) +
                    condicionArr(renal, 'Diálisis', 16, 17, 18) +
                    condicionArr(renal, 'Trasplante', 19, 20, 21) +
                    otraCondicionArr(renal, 22, 23, 24, 25);
                if (renales) appVals += SS('Renales', renales);

                // --- HEPÁTICOS Y GASTROINTESTINALES ---
                let hepaticosGI =
                    condicionArr(gastro, 'Insuficiencia Hepática / Cirrosis', 1, 2, 3) +
                    condicionArr(gastro, 'Hepatitis (B o C)', 4, 5, 6) +
                    condicionArr(gastro, 'Hígado graso', 7, 8, 9) +
                    condicionArr(gastro, 'Hepatitis A', 10, 11, 12) +
                    condicionArr(gastro, 'Hepatitis B', 13, 14, 15) +
                    condicionArr(gastro, 'Hepatitis C', 16, 17, 18) +
                    condicionArr(gastro, 'Insuficiencia Hepática', 19, 20, 21) +
                    condicionArr(gastro, 'Cirrosis', 22, 23, 24) +
                    condicionArr(gastro, 'Gastritis', 25, 26, 27) +
                    condicionArr(gastro, 'Reflujo gastroesofágico', 28, 29, 30) +
                    condicionArr(gastro, 'Estreñimiento', 31, 32, 33) +
                    condicionArr(gastro, 'Litiasis vesicular', 34, 35, 36) +
                    otraCondicionArr(gastro, 37, 38, 39, 40);
                if (hepaticosGI) appVals += SS('Hepáticos y gastrointestinales', hepaticosGI);

                const cirugia = F('Año', V(p2, 141)) + F('Tipo de cirugía / causa', V(p2, 142), true) + F('Cirugía bariátrica', V(p2, 143)) + F('Delirium postoperatorio previo', V(p2, 144));
                if (cirugia) appVals += SS('Quirúrgicos y hospitalizaciones previas', `<div class="grid">${cirugia}</div>`);

                const alergias = F('Alergias a medicamentos generales', V(p2, 146), true) + F('Reacciones graves a psicofármacos previos', V(p2, 147), true);
                if (alergias) appVals += SS('Alergias y reacciones adversas a medicamentos (RAM)', `<div class="grid">${alergias}</div>`);

                if (appVals) a += SS('1. Antecedentes Médicos Patológicos (APP)', appVals);
            }

            let ago = '';
            ago += F('Menarca', V(p2, 151)) +
                   F('Ciclos menstruales', V(p2, 152)) +
                   F('Duración y frecuencia', V(p2, 153)) +
                   F('FUM', V(p2, 154));

            let fo = F('G', V(p2, 156)) + F('P', V(p2, 157)) + F('A', V(p2, 158)) + F('C', V(p2, 159));
            if (fo) ago += `<div class="f full"><span class="fl">Fórmula Obstétrica</span><div class="formula">${fo}</div></div>`;

            ago += F('Hijos vivos', V(p2, 160)) +
                   F('Complicaciones obstétricas', V(p2, 161), true) +
                   F('Estado actual', V(p2, 162)) +
                   F('Embarazo actual', V(p2, 163)) +
                   F('Semanas de gestación', V(p2, 164)) +
                   F('Lactancia activa', V(p2, 165)) +
                   F('Uso de anticonceptivos hormonales', V(p2, 166)) +
                   F('Nombre / Tipo', V(p2, 167));

            const isNegarAGO = V(p2, 168).trim().toUpperCase() === 'X';
            if (isNegarAGO) {
                const notaNiegaAGO = V(p2, 169) || 'Sin antecedentes ginecoobstétricos patológicos o de riesgo actuales.';
                ago += `<div class="f full"><span class="fl">Paciente niega AGO</span><div class="fv">${E(notaNiegaAGO)}</div></div>`;
            }

            if (ago) a += SS('Antecedentes ginecoobstétricos (AGO)', `<div class="grid">${ago}</div>`);

            if (a) h += SEC('Antecedentes personales', a);

            // --- SECCIÓN: ANTECEDENTES PSIQUIÁTRICOS PREVIOS (P3) ---
            let ps = '';
            const isPrimeraVez = V(p3, 1).toUpperCase() === 'X';
            if (isPrimeraVez || C(V(p3, 1))) {
                ps += SS('3. Antecedentes psiquiátricos previos (APP-Psi)', `<div class="grid">${F('Primera vez en Psiquiatría', V(p3, 1))}${F('Nota primera vez', V(p3, 2), true)}</div>`);
            }

            const dxPairs = [
                ['Trastorno Depresivo', 4, 5],
                ['Trastorno Bipolar', 6, 7],
                ['Trastornos de Ansiedad', 8, 9],
                ['Trastorno Obsesivo-Compulsivo (TOC) o trastornos relacionados', 10, 11],
                ['Trastorno por Estrés Postraumático (TEPT) o del desarrollo/apego', 12, 13],
                ['Trastorno del Espectro de la Esquizofrenia / Otros trastornos psicóticos', 14, 15],
                ['Trastorno por Déficit de Atención e Hiperactividad (TDAH)', 16, 17],
                ['Trastorno del Neurodesarrollo (TEA nivel 1, 2 o 3)', 18, 19],
                ['Trastornos de la Conducta Alimentaria (Anorexia, Bulimia, PICA, etc.)', 20, 21],
                ['Trastorno de la Personalidad', 22, 23]
            ];

            let dxBlocks = '';
            dxPairs.forEach(([labelTrastorno, idxT, idxE]) => {
                const valT = V(p3, idxT);
                const valE = V(p3, idxE);
                if (valT || valE) {
                    dxBlocks += `<div class="grid-2">${F(labelTrastorno, valT)}${F('Edad de diagnóstico / Año', valE)}</div>`;
                }
            });

            const otroDxVal = V(p3, 24);
            const otroDx = otroDxVal ? F('Otro diagnóstico psiquiátrico previo', otroDxVal, true) : '';

            let dx = dxBlocks + otroDx;
            if (dx) ps += SS('a. Historial de Diagnósticos Previos', dx);

            const rows6 = parseRows(g('P6'));
            if (rows6.length > 0) {
                let t = '<table class="tbl"><thead><tr><th>Grupo Farmacológico</th><th>Nombre del Fármaco</th><th>Tiempo de Uso</th><th>Dosis Máxima</th><th>Motivo de Suspensión</th></tr></thead><tbody>';
                rows6.forEach(r => {
                    t += `<tr><td>${E((r[0] || '').replace(/^,\s*/, ''))}</td><td>${E(r[1] || '')}</td><td>${E(r[2] || '')}</td><td>${E(r[3] || '')}</td><td>${E(r[4] || '')}</td></tr>`;
                });
                t += '</tbody></table>';
                ps += SS('b. Historial de Tratamientos Anteriores', t);
            }

            let tr = F('Psicoterapia', V(p3, 26), true) + F('Enfoque', V(p3, 27)) + F('Duración', V(p3, 28)) + F('Apego', V(p3, 29));
            if (tr) ps += SS('Historial de Psicoterapia', `<div class="grid">${tr}</div>`);

            let su = F('Historial de Ideación Suicida', V(p3, 31)) + F('Historial de Intentos de Suicidio', V(p3, 32)) + F('Número de intentos', V(p3, 33)) + F('Edad / Año del intento más grave', V(p3, 34)) + F('Método(s)', V(p3, 35), true) + F('Hospitalización', V(p3, 36), true) + F('Conductas de Autolesión no suicidas', V(p3, 37), true);
            if (su) ps += SS('c. Intentos de Suicidio y Conductas de Autolesión (Sección Crítica)', `<div class="grid">${su}</div>`);

            let inx = F('Hospitalizaciones Psiquiátricas Previas', V(p3, 39), true) + F('Número total', V(p3, 40)) + F('Año y duración del último internamiento', V(p3, 41)) + F('Causa principal', V(p3, 42), true) + F('Tipo de ingreso', V(p3, 43));
            if (inx) ps += SS('d. Historial de Internamientos Psiquiátricos', `<div class="grid">${inx}</div>`);

            const bioPairs = [
                ['Terapia Electroconvulsiva (TEC) anterior', 45, 46],
                ['Estimulación Magnética Transcraneal (EMT) anterior', 47, 48],
                ['Otro (tDCS, Ketamina / Esketamina IV o Intranasal)', 49, 50]
            ];

            let bioBlocks = '';
            bioPairs.forEach(([labelBio, idxB, idxSpec]) => {
                const valB = V(p3, idxB);
                const valSpec = V(p3, idxSpec);
                if (valB || valSpec) {
                    bioBlocks += `<div class="grid-2">${F(labelBio, valB)}${F('Especificar año, número de sesiones y respuesta', valSpec)}</div>`;
                }
            });

            if (bioBlocks) ps += SS('e. Tratamientos Biológicos No Farmacológicos', bioBlocks);

            if (ps) h += SEC('Antecedentes psiquiátricos previos', ps);

            // --- SECCIÓN: ANTECEDENTES HEREDOFAMILIARES (P5 / P7) ---
            const rows5 = parseRows(g('P5'));
            if (rows5.length > 0) {
                let t = '<table class="tbl tbl-familiar"><thead><tr><th>Parentesco</th><th>Edad</th><th>Estado</th><th>Patologías Psiquiátricas y Adicciones</th><th>Intento de suicidio</th><th>Suicidio consumado</th><th>Patologías Médicas Crónicas</th><th>Especificar patologías</th></tr></thead><tbody>';
                rows5.forEach(r => {
                    t += `<tr><td>${E((r[0] || '').replace(/^,\s*/, ''))}</td><td>${E(r[1] || '')}</td><td>${E(r[2] || '')}</td><td>${E(r[3] || '')}</td><td>${E(r[4] || '')}</td><td>${E(r[5] || '')}</td><td>${E(r[6] || '')}</td><td>${E(r[7] || '')}</td></tr>`;
                });
                t += '</tbody></table>';
                h += SEC('1. Mapeo Dinámico por Familiar', t);
            } else {
                const ah = F('Sin antecedentes familiares de importancia', V(p7, 1), true) + F('Reporte', V(p7, 2), true);
                if (ah) h += SEC('ANTECEDENTES HEREDOFAMILIARES (AHF)', `<div class="grid">${ah}</div>`);
            }

            // --- SECCIÓN: HÁBITOS PSICOBIOLÓGICOS Y USO DE SUSTANCIAS (P7) ---
            let hb = '';
            const hbGeneral =
                F('Horas promedio de sueño nocturno', V(p7, 7)) +
                F('Calidad del sueño', V(p7, 8)) +
                F('Frecuencia de alimentación', V(p7, 10)) +
                F('Descripción de alimentación', V(p7, 11), true) +
                F('Frecuencia semanal de ejercicio', V(p7, 13)) +
                F('Tipo de ejercicio', V(p7, 14)) +
                F('Uso de pantallas (h/día)', V(p7, 16)) +
                F('Supervisión de pantallas', V(p7, 17)) +
                F('Contenido de pantallas', V(p7, 18), true);
            if (hbGeneral) hb += SS('1. Hábitos Psicobiológicos Generales', `<div class="grid">${hbGeneral}</div>`);

            const noConsumeMarcado = V(p7, 21).toUpperCase() === 'X';
            const notaNoConsumo = noConsumeMarcado ? F('Nota', V(p7, 22), true) : '';
            let sust = notaNoConsumo ? `<div class="grid">${notaNoConsumo}</div>` : '';

            const cafeina =
                F('Café / Cafeína', V(p7, 23)) +
                F('Frecuencia y Cantidad', V(p7, 24)) +
                F('Impacto clínico percibido', V(p7, 25));
            if (cafeina) sust += `<div class="grid-3">${cafeina}</div>`;

            const renderSubst = (title, iEstatus, iEdad, iFreq, iCant, iFecha, iCrit, iExtra = null) => {
                const estatus = V(p7, iEstatus);
                const edad = V(p7, iEdad);
                const freq = V(p7, iFreq);
                const cant = V(p7, iCant);
                const fecha = V(p7, iFecha);
                const crit = V(p7, iCrit);
                const critFormato = iCrit === 32 ? crit.replace(/\s*,\s*/g, '\n') : crit;
                const extra = iExtra !== null ? V(p7, iExtra) : '';
                if (!estatus && !edad && !freq && !cant && !fecha && !crit && !extra) return '';

                let beforeTable = '';
                let afterTable = '';
                if (extra) beforeTable += `<div class="grid">${F('CAGE Automatizado', extra)}</div>`;

                const datosConsumo = F('Estatus de consumo', estatus) +
                    F('Edad de inicio del consumo', edad) +
                    F('Frecuencia actual', freq) +
                    F('Cantidad / Patrón', cant) +
                    F('Fecha de último consumo', fecha);
                const tablaConsumo = datosConsumo ? `<div class="grid-5">${datosConsumo}</div>` : '';

                if (crit) afterTable += `<div class="grid">${F('Criterios Clínicos Rápidos', critFormato, true)}</div>`;

                return `<div class="sst" style="margin-top:8px; font-size:9.5px; border-bottom:1px solid var(--b); padding-bottom:2px; text-transform:uppercase; color:var(--p);">${E(title)}</div>${beforeTable}${tablaConsumo}${afterTable}`;
            };

            sust += renderSubst('Tabaco / Nicotina', 27, 28, 29, 30, 31, 32);
            sust += renderSubst('Chimó / Tabaco mascado', 34, 35, 36, 37, 38, 39);
            sust += renderSubst('Alcohol', 42, 43, 44, 45, 46, 47, 41);
            sust += renderSubst('Cannabis (Marihuana, THC, CBD)', 49, 50, 51, 52, 53, 54);
            sust += renderSubst('Estimulantes (Cocaína, crack, anfetaminas, MDMA)', 56, 57, 58, 59, 60, 61);
            sust += renderSubst('Opioides / Analgésicos (Fentanilo, tramadol, heroína, etc.)', 63, 64, 65, 66, 67, 68);
            sust += renderSubst('Benzodiacepinas / Sedantes (Sin prescripción médica)', 70, 71, 72, 73, 74, 75);
            if (sust) hb += SS('2. Consumo y Dependencia de Sustancias', sust);
            if (hb) h += SEC('HÁBITOS PSICOBIOLÓGICOS Y USO DE SUSTANCIAS', hb);

            if (q.get('debug') === '1') {
                const debugInfo = [
                    `P3 recibido: ${g('P3') ? 'sí' : 'NO'} (${g('P3').length} caracteres)`,
                    `P7 recibido: ${g('P7') ? 'sí' : 'NO'} (${g('P7').length} caracteres)`,
                    `VC_APP_Neurologicos: ${g('VC_APP_Neurologicos') ? 'sí' : 'NO'}`
                ].join('\n');
                h += SEC('DIAGNÓSTICO TÉCNICO (solo debug=1)', `<div class="f full"><div class="fv">${E(debugInfo)}</div></div>`);
            }

            // --- CONCLUSIONES DIAGNÓSTICAS ---
            const rows4 = parseRows(g('P4'));
            if (rows4.length > 0) {
                let t = '<table class="tbl"><thead><tr><th>CIE-11 ID</th><th>Tipo de Diagnóstico</th><th>Especificador de Gravedad</th><th>Especificador de Curso / Episodio</th><th>Severidad de la Disfunción de Personalidad</th><th>Rasgos de Dominio Prominentes</th></tr></thead><tbody>';
                rows4.forEach(r => {
                    t += `<tr><td>${E((r[0] || '').replace(/^,\s*/, ''))}</td><td>${E(r[1] || '')}</td><td>${E(r[2] || '')}</td><td>${E(r[3] || '')}</td><td>${E(r[4] || '')}</td><td>${E(r[5] || '')}</td></tr>`;
                });
                t += '</tbody></table>';
                h += SEC('CONCLUSIONES DIAGNÓSTICAS (CIE-11)', t);
            }

            const notasDiagnosticas = F('Notas Diagnósticas y Juicio Clínico', g('NotasDiagnosticas'), true);
            const impresionDiagnostica = F('Impresión diagnóstica y discusión', g('ImpresionDiagnostica'), true);
            const textoDiagnostico = notasDiagnosticas + impresionDiagnostica;
            if (textoDiagnostico) {
                h += SEC('Notas y juicio clínico', `<div class="grid">${textoDiagnostico}</div>`);
            }

            document.getElementById('content').innerHTML = h;
            if (!h.trim()) document.getElementById('empty').style.display = 'block';

            const foot = ['Direccion', 'Numero+de+telefono+principal', 'Numero+secundario', 'Whatsapp', 'Redes+sociales', 'Correo+electronico'].map(g).map(C).filter(Boolean);
            document.getElementById('footer').innerHTML = foot.map(x => `<span>${E(x)}</span>`).join('');
            }

            const patientId = q.get('id');
            const putIfPresent = (key, ...values) => {
                for (const value of values) {
                    if (value !== undefined && value !== null && String(value) !== '') {
                        q.set(key, String(value));
                        return;
                    }
                }
            };

            if (patientId) {
                window.InnovamedHC3Receive = data => {
                    if (!data || data.ok !== true) {
                        const detail = data && data.error ? data.error : 'Respuesta de datos no válida.';
                        document.getElementById('content').textContent = 'No se pudieron cargar los datos clínicos desde Apps Script. ' + detail;
                        document.getElementById('empty').style.display = 'none';
                        return;
                    }

                    putIfPresent('P1', data.P1, data.p1, data.VC_Blob_Clinica);
                    putIfPresent('P2', data.P2, data.p2, data.VC_Blob_Antecedentes);
                    putIfPresent('P3', data.P3, data.p3, data.VC_Blob_Psiquiatria);
                    putIfPresent('P4', data.P4, data.p4, data.VC_Blob_Diagnostico, data.VC_Blob_Diagnosticos);
                    putIfPresent('P5', data.P5, data.p5, data.VC_Blob_MapeoFamiliar);
                    putIfPresent('P6', data.P6, data.p6, data.VC_Blob_Tratamiento);
                    putIfPresent('P7', data.P7, data.p7, data.VC_Blob_Habitos);
                    
                    // Inyección de las 5 nuevas columnas recibidas desde el JSON del Apps Script
                    putIfPresent('VC_APP_Neurologicos', data.VC_APP_Neurologicos);
                    putIfPresent('VC_APP_Endocrinos', data.VC_APP_Endocrinos);
                    putIfPresent('VC_APP_Renales', data.VC_APP_Renales);
                    putIfPresent('VC_APP_Cardiovascular', data.VC_APP_Cardiovascular);
                    putIfPresent('VC_APP_HepaticoGastrointestinal', data.VC_APP_HepaticoGastrointestinal);

                    putIfPresent('NotasDiagnosticas', data.NotasDiagnosticas);
                    putIfPresent('ImpresionDiagnostica', data.ImpresionDiagnostica);
                    render();
                };

                const script = document.createElement('script');
                script.onerror = () => {
                    document.getElementById('content').textContent = 'No fue posible conectar con Apps Script. Verifica la URL publicada y los permisos de la aplicación web.';
                    document.getElementById('empty').style.display = 'none';
                };
                script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') +
                    'id=' + encodeURIComponent(patientId) +
                    '&k=' + encodeURIComponent(q.get('k') || '') +
                    '&callback=InnovamedHC3Receive';
                document.head.appendChild(script);
            } else {
                render();
            }
        })();
    </script>
</body>
</html>
