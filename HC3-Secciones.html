<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clínica Psiquiátrica</title>

    <style>
        :root {
            --p: #2b3e50;
            --b: #d0d7de;
            --m: #57606a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            color: #24292f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
        }

        body {
            padding: 15px;
        }

        .doc {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            background: #fff;
            padding: 15mm 15mm 20mm;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--p);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            flex: 0 0 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hm {
            flex: 1;
            padding: 0 10px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--p);
            text-transform: uppercase;
            margin: 0 0 2px;
            letter-spacing: 0.5px;
        }

        .sub {
            font-size: 10px;
            font-weight: bold;
            color: var(--m);
            margin-bottom: 2px;
        }

        .docline {
            font-size: 9px;
            color: var(--m);
        }

        .patient {
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr 1fr 1.5fr;
            border-bottom: 1px solid var(--p);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .pi {
            padding: 2px 6px;
            min-width: 0;
        }

        .lab {
            display: block;
            font-size: 8px;
            color: var(--m);
            text-transform: uppercase;
            font-weight: bold;
        }

        .val {
            font-weight: 600;
            word-break: break-word;
            font-size: 10.5px;
        }

        .sec {
            margin: 12px 0;
        }

        .st {
            color: var(--p);
            font-weight: 700;
            padding: 4px 0;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--p);
            break-after: avoid;
        }

        .sst {
            color: var(--p);
            font-weight: 700;
            font-size: 10px;
            padding: 4px 0 2px;
            margin: 6px 0 3px;
            break-after: avoid;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
        }

        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px 6px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
        }

        .grid-5 .f {
            border-bottom: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 10px;
            grid-column: 1 / -1;
            background: #fcfcfc;
            border: 1px solid var(--b);
            padding: 4px 6px;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        .f {
            padding: 3px 2px;
            break-inside: avoid;
            min-width: 0;
            text-align: left;
            border-bottom: 1px dotted var(--b);
        }

        .grid-3 .f, .grid-2 .f {
            border-bottom: none;
        }

        .f.full {
            grid-column: 1 / -1;
        }

        .fl {
            display: block;
            color: var(--m);
            font-size: 8px;
            font-weight: 700;
            margin-bottom: 1px;
            text-align: left;
            text-transform: uppercase;
        }

        .fv {
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
            line-height: 1.35;
            font-size: 10px;
        }

        .mental {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
        }

        .mi {
            padding: 3px 2px;
            break-inside: avoid;
            border-bottom: 1px dotted var(--b);
        }

        .mil {
            font-size: 8px;
            font-weight: 700;
            color: var(--m);
            text-transform: uppercase;
        }

        .miv {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 1px;
            text-align: left;
            font-size: 10px;
        }

        .formula {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 8px;
            font-size: 10px;
            background: #fff;
        }

        .tbl th {
            color: var(--p);
            font-weight: 700;
            padding: 4px 6px;
            border-bottom: 2px solid var(--p);
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            background: transparent;
        }

        .tbl td {
            padding: 6px;
            border-bottom: 1px solid var(--b);
            color: #24292f;
            word-break: break-word;
            text-align: left;
            vertical-align: top;
            font-size: 10px;
        }

        .tbl-familiar {
            table-layout: fixed;
            font-size: 8px;
        }

        .tbl-familiar th {
            padding: 4px 3px;
            font-size: 7px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar td {
            padding: 5px 3px;
            font-size: 8px;
            overflow-wrap: anywhere;
        }

        .tbl-familiar th:nth-child(1) { width: 14%; }
        .tbl-familiar th:nth-child(2) { width: 5%; }
        .tbl-familiar th:nth-child(3) { width: 7%; }
        .tbl-familiar th:nth-child(4) { width: 17%; }
        .tbl-familiar th:nth-child(5) { width: 9%; }
        .tbl-familiar th:nth-child(6) { width: 9%; }
        .tbl-familiar th:nth-child(7) { width: 17%; }
        .tbl-familiar th:nth-child(8) { width: 22%; }

        .tbl-familiar tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .footer {
            position: fixed;
            left: 15mm;
            right: 15mm;
            bottom: 6mm;
            border-top: 1px solid var(--b);
            padding-top: 4px;
            text-align: center;
            color: var(--m);
            font-size: 8px;
            background: #fff;
        }

        .footer span:not(:last-child)::after {
            content: ' | ';
            margin: 0 4px;
        }

        .buttons {
            position: fixed;
            right: 12px;
            top: 12px;
            z-index: 20;
        }

        .selection-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 30, 40, .48);
            backdrop-filter: blur(2px);
        }
        .selection-backdrop[hidden] { display: none !important; }
        .selection-panel {
            width: min(760px, 100%);
            max-height: min(82vh, 760px);
            overflow: auto;
            padding: 22px;
            border: 1px solid rgba(0,0,0,.08);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 18px 60px rgba(0,0,0,.28), 0 4px 14px rgba(0,0,0,.12);
        }
        .selection-panel h2 { margin: 0 0 8px; font-size: 18px; color: var(--p); }
        .selection-panel p { margin: 0 0 14px; color: var(--m); }
        .section-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 16px 0 20px; }
        .section-option { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; padding: 8px; border-radius: 6px; background: #f7f9fb; }
        .section-option input { margin-top: 1px; }
        .selection-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        @media (max-width: 600px) { .selection-backdrop { padding: 10px; } .selection-panel { padding: 16px; max-height: 88vh; } .section-options { grid-template-columns: 1fr; } .logo { width: 90px; height: 90px; flex-basis: 90px; } .header { gap: 6px; } }

        button {
            border: 0;
            border-radius: 4px;
            background: var(--p);
            color: white;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: var(--m);
            padding: 20px;
        }

        @page {
            size: A4;
            margin: 10mm 15mm 15mm;
        }

        @media print {
            html, body {
                background: #fff;
                padding: 0;
            }

            .doc {
                width: auto;
                min-height: 0;
                margin: 0;
                padding: 0 0 15mm;
                box-shadow: none;
            }

            .buttons, .selection-panel {
                display: none !important;
            }

            .footer {
                position: fixed;
                bottom: 2mm;
                left: 15mm;
                right: 15mm;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">
        <button type="button" onclick="window.print()">Imprimir HC completa / PDF</button>
        <button type="button" onclick="toggleSectionSelector()">Seleccionar secciones para imprimir</button>
    </div>

    <div class="selection-backdrop" id="selection-backdrop" hidden onclick="if(event.target === this) toggleSectionSelector(false)">
        <div class="selection-panel" id="selection-panel" role="dialog" aria-modal="true" aria-labelledby="selection-title">
            <h2 id="selection-title">Seleccionar secciones para el informe</h2>
            <p>Marca una o varias secciones. El informe generado incluirá los datos del paciente y únicamente las secciones seleccionadas.</p>
            <div class="selection-actions">
                <button type="button" onclick="setAllSections(true)">Seleccionar todas</button>
                <button type="button" onclick="setAllSections(false)">Deseleccionar todas</button>
            </div>
            <div class="section-options" id="section-options"></div>
            <div class="selection-actions">
                <button type="button" onclick="printSelectedSections()">Imprimir selección / PDF</button>
                <button type="button" onclick="downloadSelectedWord()">Guardar selección en Word</button>
                <button type="button" onclick="toggleSectionSelector(false)">Cerrar</button>
            </div>
        </div>
    </div>

    <main class="doc">

        <header class="header">
            <div class="logo" id="logo">
                <img src="https://lh3.googleusercontent.com/d/1uGZTuLKjjurxjNOODEeSPy5NES6SIgDQ" alt="Logo">
            </div>
            <div class="hm">
                <h1 class="title" id="titulo"></h1>
                <div class="sub" id="subtitulo"></div>
                <div class="docline" id="info-institucion"></div>
            </div>
        </header>

        <div class="patient" id="patient"></div>
        <div id="content"></div>
        <div id="empty" class="empty" style="display:none">No se encontraron datos clínicos para mostrar.</div>

    </main>

    <footer class="footer" id="footer"></footer>

    <script>
        function toggleSectionSelector(forceOpen) {
            const backdrop = document.getElementById('selection-backdrop');
            const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : backdrop.hidden;
            backdrop.hidden = !shouldOpen;
            document.body.style.overflow = shouldOpen ? 'hidden' : '';
            if (shouldOpen) {
                refreshSectionOptions();
                const firstCheck = document.querySelector('#section-options input[type="checkbox"]');
                if (firstCheck) firstCheck.focus();
            }
        }

        function refreshSectionOptions() {
            const host = document.getElementById('section-options');
            const sections = Array.from(document.querySelectorAll('#content > .sec'));
            const old = new Map(Array.from(host.querySelectorAll('input[type="checkbox"]')).map(x => [x.dataset.index, x.checked]));
            host.innerHTML = '';
            if (!sections.length) {
                host.innerHTML = '<p>No hay secciones clínicas disponibles para seleccionar.</p>';
                return;
            }
            sections.forEach((section, index) => {
                const heading = section.querySelector(':scope > .st');
                const labelText = heading ? heading.textContent.trim() : `Sección ${index + 1}`;
                const label = document.createElement('label');
                label.className = 'section-option';
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = old.has(String(index)) ? old.get(String(index)) : true;
                input.dataset.index = String(index);
                input.value = String(index);
                const text = document.createElement('span');
                text.textContent = labelText;
                label.append(input, text);
                host.appendChild(label);
            });
        }

        function setAllSections(checked) {
            document.querySelectorAll('#section-options input[type="checkbox"]').forEach(input => input.checked = checked);
        }

        function getSelectedReport() {
            const all = Array.from(document.querySelectorAll('#content > .sec'));
            const chosen = Array.from(document.querySelectorAll('#section-options input[type="checkbox"]:checked'))
                .map(input => all[Number(input.value)]).filter(Boolean);
            if (!chosen.length) {
                alert('Selecciona al menos una sección para generar el informe.');
                return null;
            }
            const patient = document.getElementById('patient');
            const header = document.querySelector('.header');
            const cloneHeader = header.cloneNode(true);
            const patientHtml = patient.style.display === 'none' ? '' : patient.outerHTML;
            return {headerHtml: cloneHeader.outerHTML, patientHtml, contentHtml: chosen.map(x => x.outerHTML).join(''), footerHtml: document.getElementById('footer').outerHTML};
        }

        function reportDocument(report, forWord = false) {
            const styles = Array.from(document.querySelectorAll('style')).map(style => style.innerHTML).join('\n');
            const wordStyles = forWord ? `
                @page Section1 { size: 8.27in 11.69in; margin: 0.55in 0.55in 0.65in 0.55in; mso-header-margin:0.25in; mso-footer-margin:0.3in; }
                div.Section1 { page:Section1; }
                html,body { background:#fff !important; padding:0 !important; margin:0 !important; color:#24292f; font-family:Arial,Helvetica,sans-serif; font-size:9pt; line-height:1.2; }
                p,div,span { mso-line-height-rule:at-least; }
                .doc { width:100% !important; min-height:0 !important; margin:0 !important; padding:0 !important; box-shadow:none !important; }
                table { border-collapse:collapse !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
                table.header-table { width:100% !important; table-layout:fixed; border-collapse:collapse !important; border-bottom:1.5pt solid #2b3e50; margin:0 0 8pt !important; }
                td.logo-cell { width:82pt !important; vertical-align:middle; text-align:center; padding:0 8pt 6pt 0 !important; }
                td.logo-cell img { display:block; width:70pt !important; height:70pt !important; max-width:70pt !important; max-height:70pt !important; }
                td.info-cell { width:auto !important; vertical-align:middle; text-align:center; padding:0 4pt 6pt !important; }
                .title { font-size:13pt !important; line-height:1.15; margin:0 0 3pt !important; }
                .sub { font-size:9pt !important; margin:0 0 2pt !important; }
                .docline { font-size:8pt !important; }
                table.patient-data { width:100% !important; table-layout:fixed; border-collapse:collapse !important; margin:0 0 9pt !important; }
                .patient-cell { vertical-align:top; padding:3pt 4pt !important; border-bottom:0.5pt solid #d0d7de; }
                .lab { display:block; font-size:7pt !important; margin-bottom:2pt; }
                .val { display:block; font-size:8.5pt !important; font-weight:normal !important; overflow-wrap:anywhere; }
                .sec { margin:9pt 0 !important; }
                .st { font-size:9.5pt !important; padding:3pt 0 !important; margin:0 0 4pt !important; border-bottom:1pt solid #2b3e50; page-break-after:avoid; }
                .sst { font-size:8.5pt !important; margin:5pt 0 3pt !important; page-break-after:avoid; }
                .grid, .grid-2, .grid-3, .grid-5, .mental { display:table !important; width:100% !important; table-layout:fixed; border-collapse:collapse; margin:3pt 0 5pt !important; padding:0 !important; background:#fff !important; border:0.5pt solid #d0d7de; }
                .grid > tbody > tr > td, .grid-2 > tbody > tr > td, .grid-3 > tbody > tr > td, .grid-5 > tbody > tr > td, .mental > tbody > tr > td { vertical-align:top; padding:4pt 5pt; border:0.5pt solid #e0e4e8; }
                .f, .mi { display:block !important; padding:3pt 2pt !important; border-bottom:0 !important; min-width:0 !important; page-break-inside:avoid; }
                .fl, .mil { display:block; font-size:7pt !important; margin-bottom:2pt; }
                .fv, .miv { display:block; font-size:8.5pt !important; line-height:1.25 !important; white-space:pre-wrap; overflow-wrap:anywhere; }
                .tbl { width:100% !important; border-collapse:collapse !important; table-layout:fixed; font-size:8pt !important; }
                .tbl th { font-size:7pt !important; padding:4pt 3pt !important; background:#eef3f6 !important; border:0.5pt solid #c7d0d8 !important; }
                .tbl td { font-size:7.5pt !important; padding:4pt 3pt !important; border:0.5pt solid #d0d7de !important; overflow-wrap:anywhere; }
                .footer { position:static !important; margin-top:14pt !important; padding-top:5pt !important; border-top:0.5pt solid #d0d7de; text-align:center; font-size:7pt !important; }
                .buttons, .selection-backdrop, .selection-panel, #empty { display:none !important; }
            ` : `body{background:#fff;padding:0}.doc{width:auto;min-height:0;margin:0;padding:12mm;box-shadow:none}.header{break-inside:avoid}.footer{position:static;margin-top:20px;text-align:center}.buttons,.selection-backdrop,.selection-panel{display:none!important}`;
            let html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe médico - Historia Clínica</title><style>${styles}\n${wordStyles}</style></head><body><main class="doc">${report.headerHtml}${report.patientHtml}<div id="content">${report.contentHtml}</div></main>${report.footerHtml}</body></html>`;
            if (!forWord) return html;

            // Word no interpreta de forma fiable CSS Grid/Flex. Convertimos esos contenedores en tablas reales.
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            const tableFromChildren = (source, columns) => {
                const items = Array.from(source.children);
                const table = parsed.createElement('table');
                table.className = source.className;
                table.setAttribute('cellspacing', '0');
                table.setAttribute('cellpadding', '0');
                const tbody = parsed.createElement('tbody');
                for (let i = 0; i < items.length; i += columns) {
                    const tr = parsed.createElement('tr');
                    for (let j = i; j < Math.min(i + columns, items.length); j++) {
                        const td = parsed.createElement('td');
                        if (items[j].classList.contains('f') && items[j].classList.contains('full')) {
                            td.colSpan = columns;
                            td.appendChild(items[j].cloneNode(true));
                            tr.appendChild(td);
                            break;
                        }
                        td.appendChild(items[j].cloneNode(true));
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                }
                table.appendChild(tbody);
                source.replaceWith(table);
            };
            const content = parsed.getElementById('content');
            Array.from(content.querySelectorAll('.grid, .grid-2, .grid-3, .grid-5, .mental')).reverse().forEach(el => {
                const columns = el.classList.contains('grid-5') ? 5 : el.classList.contains('grid-3') ? 3 : 2;
                tableFromChildren(el, columns);
            });
            const header = parsed.querySelector('.header');
            if (header) {
                const logo = header.querySelector('.logo');
                const hm = header.querySelector('.hm');
                const table = parsed.createElement('table');
                table.className = 'header-table';
                table.setAttribute('width', '100%'); table.setAttribute('cellspacing', '0'); table.setAttribute('cellpadding', '0');
                const tbody = parsed.createElement('tbody'); const tr = parsed.createElement('tr');
                const logoCell = parsed.createElement('td'); logoCell.className = 'logo-cell'; logoCell.setAttribute('width', '110'); logoCell.setAttribute('valign', 'middle');
                const hmCell = parsed.createElement('td'); hmCell.className = 'info-cell'; hmCell.setAttribute('valign', 'middle'); hmCell.setAttribute('align', 'center');
                if (logo) {
                    const img = logo.querySelector('img');
                    if (img) {
                        const wordImg = img.cloneNode(true);
                        wordImg.setAttribute('width', '93'); wordImg.setAttribute('height', '93');
                        wordImg.setAttribute('style', 'width:70pt;height:70pt;display:block;border:0;');
                        wordImg.removeAttribute('srcset');
                        logoCell.appendChild(wordImg);
                    }
                }
                if (hm) Array.from(hm.childNodes).forEach(node => hmCell.appendChild(node.cloneNode(true)));
                tr.append(logoCell, hmCell); tbody.appendChild(tr); table.appendChild(tbody); header.replaceWith(table);
            }
            const patient = parsed.querySelector('.patient');
            if (patient) {
                const items = Array.from(patient.children);
                const table = parsed.createElement('table'); table.className = 'patient-data';
                table.setAttribute('width', '100%'); table.setAttribute('cellspacing', '0'); table.setAttribute('cellpadding', '0');
                const tbody = parsed.createElement('tbody'); const tr = parsed.createElement('tr');
                items.forEach(item => { const td = parsed.createElement('td'); td.className = 'patient-cell'; Array.from(item.childNodes).forEach(node => td.appendChild(node.cloneNode(true))); tr.appendChild(td); });
                tbody.appendChild(tr); table.appendChild(tbody); patient.replaceWith(table);
            }
            // Añade dimensiones explícitas a cualquier otra imagen: Word suele ignorar max-width/max-height.
            parsed.querySelectorAll('img').forEach(img => {
                if (!img.hasAttribute('width')) img.setAttribute('width', '93');
                if (!img.hasAttribute('height')) img.setAttribute('height', '93');
                img.style.maxWidth = '70pt'; img.style.maxHeight = '70pt';
            });
            parsed.documentElement.setAttribute('xmlns:o', 'urn:schemas-microsoft-com:office:office');
            parsed.documentElement.setAttribute('xmlns:w', 'urn:schemas-microsoft-com:office:word');
            const office = parsed.createElement('div'); office.className = 'Section1';
            while (parsed.body.firstChild) office.appendChild(parsed.body.firstChild);
            parsed.body.appendChild(office);
            const officeStyle = parsed.createElement('style');
            officeStyle.textContent = `@page Section1 { size:8.27in 11.69in; margin:0.55in 0.55in 0.65in; mso-header-margin:0.25in; mso-footer-margin:0.3in; } div.Section1 { page:Section1; } table { mso-table-lspace:0pt; mso-table-rspace:0pt; } td { vertical-align:top; }`;
            parsed.head.appendChild(officeStyle);
            return '<!DOCTYPE html>\n' + parsed.documentElement.outerHTML;
        }

        function printSelectedSections() {
            const report = getSelectedReport();
            if (!report) return;
            const win = window.open('', '_blank');
            if (!win) { alert('El navegador bloqueó la ventana del informe. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.'); return; }
            win.document.open();
            win.document.write(reportDocument(report));
            win.document.close();

                    F('Frecuencia actual', freq) +
                    F('Cantidad / Patrón', cant) +
                    F('Fecha de último consumo', fecha);
                const tablaConsumo = datosConsumo ? `<div class="grid-5">${datosConsumo}</div>` : '';

                if (crit) afterTable += `<div class="grid">${F('Criterios Clínicos Rápidos', critFormato, true)}</div>`;

                return `<div class="sst" style="margin-top:8px; font-size:9.5px; border-bottom:1px solid var(--b); padding-bottom:2px; text-transform:uppercase; color:var(--p);">${E(title)}</div>${beforeTable}${tablaConsumo}${afterTable}`;
            };

            sust += renderSubst('Tabaco / Nicotina', 27, 28, 29, 30, 31, 32);
            sust += renderSubst('Chimó / Tabaco mascado', 34, 35, 36, 37, 38, 39);
            sust += renderSubst('Alcohol', 42, 43, 44, 45, 46, 47, 41);
            sust += renderSubst('Cannabis (Marihuana, THC, CBD)', 49, 50, 51, 52, 53, 54);
            sust += renderSubst('Estimulantes (Cocaína, crack, anfetaminas, MDMA)', 56, 57, 58, 59, 60, 61);
            sust += renderSubst('Opioides / Analgésicos (Fentanilo, tramadol, heroína, etc.)', 63, 64, 65, 66, 67, 68);
            sust += renderSubst('Benzodiacepinas / Sedantes (Sin prescripción médica)', 70, 71, 72, 73, 74, 75);
            if (sust) hb += SS('2. Consumo y Dependencia de Sustancias', sust);
            if (hb) h += SEC('HÁBITOS PSICOBIOLÓGICOS Y USO DE SUSTANCIAS', hb);

            // Diagnóstico temporal: añadir ?debug=1 al final de la URL para verificar
            // si el navegador recibió los parámetros P3 y P7 desde AppSheet.
            if (q.get('debug') === '1') {
                const debugInfo = [
                    `P3 recibido: ${g('P3') ? 'sí' : 'NO'} (${g('P3').length} caracteres)`,
                    `P7 recibido: ${g('P7') ? 'sí' : 'NO'} (${g('P7').length} caracteres)`,
                    `P7 campos separados: ${p7.length}`,
                    `P7 muestra inicial: ${g('P7').slice(0, 180) || '(vacío)'}`
                ].join('\n');
                h += SEC('DIAGNÓSTICO TÉCNICO (solo debug=1)', `<div class="f full"><div class="fv">${E(debugInfo)}</div></div>`);
            }

            // --- CONCLUSIONES DIAGNÓSTICAS ---
            const rows4 = parseRows(g('P4'));
            if (rows4.length > 0) {
                let t = '<table class="tbl"><thead><tr><th>CIE-11 ID</th><th>Tipo de Diagnóstico</th><th>Especificador de Gravedad</th><th>Especificador de Curso / Episodio</th><th>Severidad de la Disfunción de Personalidad</th><th>Rasgos de Dominio Prominentes</th></tr></thead><tbody>';
                rows4.forEach(r => {
                    t += `<tr><td>${E((r[0] || '').replace(/^,\s*/, ''))}</td><td>${E(r[1] || '')}</td><td>${E(r[2] || '')}</td><td>${E(r[3] || '')}</td><td>${E(r[4] || '')}</td><td>${E(r[5] || '')}</td></tr>`;
                });
                t += '</tbody></table>';
                h += SEC('CONCLUSIONES DIAGNÓSTICAS (CIE-11)', t);
            }

            // Campos almacenados directamente en la tabla paciente; no dependen de índices del blob P3.
            const notasDiagnosticas = F('Notas Diagnósticas y Juicio Clínico', g('NotasDiagnosticas'), true);
            const impresionDiagnostica = F('Impresión diagnóstica y discusión', g('ImpresionDiagnostica'), true);
            const textoDiagnostico = notasDiagnosticas + impresionDiagnostica;
            if (textoDiagnostico) {
                h += SEC('Notas y juicio clínico', `<div class="grid">${textoDiagnostico}</div>`);
            }

            document.getElementById('content').innerHTML = h;
            if (!document.getElementById('selection-panel').hidden) refreshSectionOptions();
            if (!h.trim()) document.getElementById('empty').style.display = 'block';

            const foot = ['Direccion', 'Numero+de+telefono+principal', 'Numero+secundario', 'Whatsapp', 'Redes+sociales', 'Correo+electronico'].map(g).map(C).filter(Boolean);
            document.getElementById('footer').innerHTML = foot.map(x => `<span>${E(x)}</span>`).join('');
            }

            // Recuperar los bloques desde Apps Script. Se aceptan los nombres actuales
            // y los nombres de columnas VC_Blob_* usados por la versión anterior.
            const patientId = q.get('id');
            const putIfPresent = (key, ...values) => {
                for (const value of values) {
                    if (value !== undefined && value !== null && String(value) !== '') {
                        q.set(key, String(value));
                        return;
                    }
                }
            };

            if (patientId) {
                // Apps Script devuelve JSONP y exige id, token k y callback.
                // La versión anterior usaba fetch + JSON y omitía k/callback, por lo que no era compatible.
                window.InnovamedHC3Receive = data => {
                    if (!data || data.ok !== true) {
                        const detail = data && data.error ? data.error : 'Respuesta de datos no válida.';
                        document.getElementById('content').textContent = 'No se pudieron cargar los datos clínicos desde Apps Script. ' + detail;
                        document.getElementById('empty').style.display = 'none';
                        return;
                    }

                    putIfPresent('P1', data.P1, data.p1, data.VC_Blob_Clinica);
                    putIfPresent('P2', data.P2, data.p2, data.VC_Blob_Antecedentes);
                    putIfPresent('P3', data.P3, data.p3, data.VC_Blob_Psiquiatria);
                    putIfPresent('P4', data.P4, data.p4, data.VC_Blob_Diagnostico, data.VC_Blob_Diagnosticos);
                    putIfPresent('P5', data.P5, data.p5, data.VC_Blob_MapeoFamiliar);
                    putIfPresent('P6', data.P6, data.p6, data.VC_Blob_Tratamiento);
                    putIfPresent('P7', data.P7, data.p7, data.VC_Blob_Habitos);
                    putIfPresent('NotasDiagnosticas', data.NotasDiagnosticas);
                    putIfPresent('ImpresionDiagnostica', data.ImpresionDiagnostica);
                    render();
                };

                const script = document.createElement('script');
                script.onerror = () => {
                    document.getElementById('content').textContent = 'No fue posible conectar con Apps Script. Verifica la URL publicada y los permisos de la aplicación web.';
                    document.getElementById('empty').style.display = 'none';
                };
                script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') +
                    'id=' + encodeURIComponent(patientId) +
                    '&k=' + encodeURIComponent(q.get('k') || '') +
                    '&callback=InnovamedHC3Receive';
                document.head.appendChild(script);
            } else {
                // Permite abrir el HTML con parámetros P1–P7 directamente para pruebas.
                render();
            }
        })();
    </script>
</body>
</html>
